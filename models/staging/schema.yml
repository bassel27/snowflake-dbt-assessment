version: 2

models:
  - name: stg_orders
    description: "Silver layer: Orders enriched with customer name and derived fields"
    columns:
      - name: o_orderkey
        description: "Primary key of the orders table (TPCH.orders.o_orderkey). Uniquely identifies each order."
        tests:
          - unique
          - not_null
      - name: o_custkey
        description: "Foreign key referencing TPCH.customer.c_custkey. Links an order to the customer who placed it."
        tests:
          - relationships:
              to: ref('customer')   # For every value in o_custkey, dbt checks that the same value exists in customer.c_custkey.
              field: c_custkey
      - name: c_name
        description: "Customer name from the TPCH.customer table. Joined via o_custkey = c_custkey."
      - name: order_year
        description: "Year extracted from o_orderdate. Used for aggregations and trend analysis."
      - name: total_price
        description: "Alias for the total price of the order carried forward from TPCH.orders (o_totalprice)."